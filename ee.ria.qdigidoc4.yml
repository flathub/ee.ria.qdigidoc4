app-id: ee.ria.qdigidoc4
command: run.sh
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
rename-icon: qdigidoc4
rename-mime-file: qdigidoc4.xml
rename-mime-icons: ["application-x-cdoc","application-vnd.etsi.asic-e+zip"]

finish-args:
  # libdigidocpp stores tsl files here
  - --persist=.digidocpp
  # Network is needed for some parts of the application's functionality
  - --share=network
  # Wayland
  - --socket=wayland
  # X11
  - --socket=fallback-x11
  - --share=ipc
  # Smartcard
  - --socket=pcsc
  - --device=all
  - --filesystem=home

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /etc/bash_completion.d
  - /share/doc
  - /share/man

modules:
  - name: flatbuffers
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://github.com/google/flatbuffers/archive/refs/tags/v25.12.19.tar.gz
        sha256: f81c3162b1046fe8b84b9a0dbdd383e24fdbcf88583b9cb6028f90d04d90696a

  - name: xmlsec
    buildsystem: autotools
    sources:
      - type: archive
        url: https://github.com/lsh123/xmlsec/archive/refs/tags/1.3.11.tar.gz
        sha256: bf499efd2f98a31244ad6855f327d7c3f06cc6c6447f0d2fbaea2b0103d47ecb
      - type: patch
        paths:
          # From https://github.com/open-eid/libdigidocpp/blob/master/xmlsec1-1.3.10.legacy.patch
          - xmlsec/xmlsec1-1.3.10.legacy.patch

  - name: libdigidocpp
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://github.com/open-eid/libdigidocpp/archive/refs/tags/v4.4.0.tar.gz
        sha256: e38c0eafbaf4aa9a7b959b8e2e15ed541e034c15e53ff9bd340749da757f72d8

  - name: openldap
    buildsystem: autotools
    config-opts:
      - --disable-backends
      - --disable-overlays
      - --disable-slapd
      - --disable-debug
      - --enable-dynamic
      - --without-threads
      - --with-tls=gnutls
    cleanup:
      - /bin
      - /share/man
    sources:
      - type: archive
        url: https://www.openldap.org/software/download/OpenLDAP/openldap-release/openldap-2.6.13.tgz
        sha256: d693b49517a42efb85a1a364a310aed16a53d428d1b46c0d31ef3fba78fcb656
      - type: script
        dest-filename: autogen.sh
        commands:
          - AUTOMAKE=/bin/true autoreconf -vfi

  - name: pcsc-lite
    buildsystem: meson
    config-opts:
      - -Dlibudev=false
      - -Dlibsystemd=false
      - -Dserial=false
      - -Dusb=false
      - -Dpolkit=false
    cleanup:
      - /sbin
    sources:
      - type: archive
        url: https://github.com/LudovicRousseau/PCSC/archive/refs/tags/2.5.0.tar.gz
        sha256: 24879115bf502c61ee673d281a68c8578e3e82506f61e4b52ffdb662722f5698

  - name: opensc
    build-options:
      cflags: -Wno-error=unterminated-string-initialization
    cleanup:
      - /share/applications/org.opensc.notify.desktop
    sources:
      - type: archive
        url: https://github.com/OpenSC/OpenSC/archive/refs/tags/0.26.1.tar.gz
        sha256: 5c4928bac2786dcaff9b2dfa43cd3de301bd137193a57adfb1a7a555656691ce
      # Patches by RIA to support the EstEID 2018 and 2025 cards, 
      # From:  https://installer.id.ee/media/ubuntu/pool/main/o/opensc/opensc_0.26.1-1RIA3.debian.tar.xz
      - type: patch
        paths:
          - opensc/0001-Use-sysconfdir-opensc-for-opensc.conf.patch
          - opensc/0002-Drop-non-functional-ENABLE_AUTOSTART.patch
          - opensc/0003-esteid2025.patch
          - opensc/0004-esteid2018.patch
          - opensc/0005-fix-pkcs11-register.patch

  - name: qdigidoc4
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://github.com/open-eid/DigiDoc4-Client/releases/download/v4.10.0/qdigidoc4-4.10.0.tar.gz
        sha256: 369c68d7a7ad4c55d57110be6f9cc7df49ff4e06a4f910e673bd8b5f3e2226c8
      - type: patch
        path: qdigidoc4/QPKCS11.patch
      - type: file
        path: ee.ria.qdigidoc4.metainfo.xml
      # See guide for building in a sandboxed environment:
      # https://github.com/open-eid/DigiDoc4-Client/wiki/DeveloperTips#building-in-sandboxed-environment
      - type: file
        url: https://ec.europa.eu/tools/lotl/eu-lotl.xml
        sha256: c07d8dea6121cfa36e24ec6a4fd5d3dacc7873e2d2d233e30d1422d0087aec0b
        dest: client
        dest-filename: eu-lotl.xml
      - type: file
        url: https://sr.riik.ee/tsl/estonian-tsl.xml
        sha256: 459f3b9e40d952caac5ecbc9f1c7ef93f1edc1793f8ee821d1854c958a153d3b
        dest: client
        dest-filename: EE.xml
      - type: file
        url: https://id.eesti.ee/config.json
        sha256: 2f5c6ebb23c7de1a8dad7ad57669693dbfcf4713189ee9f86f76467de8df1d6a
        dest: common
        dest-filename: config.json
      - type: file
        url: https://id.eesti.ee/config.ecc
        sha256: 374a860292eea5f81c79f731b4a706f3c35ec1ea8a59cf2bdc7308376cbb71e6
        dest: common
        dest-filename: config.ecc
      - type: file
        url: https://id.eesti.ee/config.ecpub
        sha256: 26049d2d34acad69b33fb0dd6eba91a23df6f2b3c1228f5efc16e29a276a8c34
        dest: common
        dest-filename: config.ecpub
      # qdigidoc4 saves files in $TMPDIR before opening them. Since this is inaccessible, we provide a wrapper script,
      # as advised here: https://docs.flatpak.org/en/latest/sandbox-permissions.html#filesystem-access
      - type: script
        dest-filename: run.sh
        commands:
          - env TMPDIR="$XDG_RUNTIME_DIR/app/$FLATPAK_ID" qdigidoc4 "$@"
    post-install:
      - install run.sh "${FLATPAK_DEST}/bin/run.sh"
      - install -Dm644 ee.ria.qdigidoc4.metainfo.xml $FLATPAK_DEST/share/metainfo/ee.ria.qdigidoc4.metainfo.xml
      - ln -s $FLATPAK_DEST/share/locale/et/LC_MESSAGES/nautilus-qdigidoc.mo $FLATPAK_DEST/share/locale/et/nautilus-qdigidoc.mo
      - ln -s $FLATPAK_DEST/share/locale/ru/LC_MESSAGES/nautilus-qdigidoc.mo $FLATPAK_DEST/share/locale/ru/nautilus-qdigidoc.mo
      - desktop-file-edit --set-key=Exec --set-value="run.sh" /app/share/applications/ee.ria.qdigidoc4.desktop
