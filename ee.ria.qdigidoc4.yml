app-id: ee.ria.qdigidoc4
command: run.sh
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
rename-icon: qdigidoc4
rename-mime-file: qdigidoc4.xml
rename-mime-icons: [application-x-cdoc, application-vnd.etsi.asic-e+zip]

finish-args:
  # libdigidocpp stores tsl files here
  - --persist=.digidocpp
  # Network is needed for some parts of the application's functionality
  - --share=network
  # Wayland
  - --socket=wayland
  # X11
  - --socket=fallback-x11
  - --share=ipc
  # Smartcard
  - --socket=pcsc
  - --device=all
  # Drag-and-drop
  - --filesystem=home

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /etc/bash_completion.d
  - /share/doc
  - /share/man

modules:
  - name: flatbuffers
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://github.com/google/flatbuffers/archive/refs/tags/v25.12.19-2026-02-06-03fffb2.tar.gz
        sha256: ccbce58684691de1e7d51f5e87786266b37d06ab66e9dfe2d0ec106fe50aace0
        x-checker-data:
          type: json
          is-important: true
          url: https://api.github.com/repos/google/flatbuffers/releases/latest
          version-query: .tag_name
          url-query: '"https://github.com/google/flatbuffers/archive/refs/tags/" +
            .tag_name + ".tar.gz"'

  - name: xmlsec
    buildsystem: autotools
    sources:
      - type: archive
        url: https://github.com/lsh123/xmlsec/releases/download/1.3.13/xmlsec1-1.3.13.tar.gz
        sha256: 7e500061eed734c55d74c786998e7562e55b1aaa72a2dff8ce3130b4c5b832d5
        x-checker-data:
          type: json
          is-important: true
          url: https://api.github.com/repos/lsh123/xmlsec/releases/latest
          version-query: .tag_name
          url-query: '"https://github.com/lsh123/xmlsec/releases/download/" + .tag_name
            + "/xmlsec1-" + .tag_name + ".tar.gz"'
      - type: patch
        paths:
          # From https://github.com/open-eid/libdigidocpp/blob/master/xmlsec1-1.3.12.legacy.patch
          - xmlsec/xmlsec1-1.3.12.legacy.patch
          # Patch to fix Fortify build issues in 1.3.13, see https://github.com/lsh123/xmlsec/discussions/1395
          - xmlsec/xmlsec-1.3.13-fortify.patch
          # Treat relative ASiC entry references as local URIs.
          - xmlsec/xmlsec-1.3.13-relative-uri.patch

  - name: libdigidocpp
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://github.com/open-eid/libdigidocpp/archive/refs/tags/v4.5.1.tar.gz
        sha256: 536ae93e95a19314645703e02c3391cfe52c590526b70daceffa4185eac5a98c
        x-checker-data:
          type: json
          is-important: true
          url: https://api.github.com/repos/open-eid/libdigidocpp/releases/latest
          version-query: .tag_name
          url-query: '"https://github.com/open-eid/libdigidocpp/archive/refs/tags/"
            + .tag_name + ".tar.gz"'
      - type: patch
        paths:
          - libdigidocpp/0001-allow-container-local-signature-references.patch

  - name: openldap
    buildsystem: autotools
    config-opts:
      - --disable-backends
      - --disable-overlays
      - --disable-slapd
      - --disable-debug
      - --enable-dynamic
      - --without-threads
      - --with-tls=gnutls
    cleanup:
      - /bin
      - /share/man
    sources:
      - type: archive
        url: https://www.openldap.org/software/download/OpenLDAP/openldap-release/openldap-2.7.2.tgz
        sha256: aad731aa22118ff327b9b4ddfc4b6f18ef9476586205da88a532e90940b523d2
        x-checker-data:
          type: anitya
          is-important: true
          project-id: 2551
          url-template: https://www.openldap.org/software/download/OpenLDAP/openldap-release/openldap-$version.tgz
      - type: script
        dest-filename: autogen.sh
        commands:
          - AUTOMAKE=/bin/true autoreconf -vfi

  - name: pcsc-lite
    buildsystem: meson
    config-opts:
      - -Dlibudev=false
      - -Dlibsystemd=false
      - -Dserial=false
      - -Dusb=false
      - -Dpolkit=false
    cleanup:
      - /sbin
    sources:
      - type: archive
        url: https://github.com/LudovicRousseau/PCSC/archive/refs/tags/2.5.3.tar.gz
        sha256: c00ea09732bb46feb03eccc70d513c3b7922ea61954cfd0c0e691702bf1d579f
        x-checker-data:
          type: json
          is-important: true
          url: https://api.github.com/repos/LudovicRousseau/PCSC/releases/latest
          version-query: .tag_name
          url-query: '"https://github.com/LudovicRousseau/PCSC/archive/refs/tags/"
            + .tag_name + ".tar.gz"'

  - name: opensc
    config-opts:
      # Fix for build error in OpenSC 0.27.1: "install: cannot create regular file '/usr/share/p11-kit/modules/opensc.module': Read-only file system"
      - --enable-p11_system_config_modules=/etc/pkcs11/modules
    cleanup:
      - /share/applications/org.opensc.notify.desktop
    sources:
      - type: archive
        url: https://github.com/OpenSC/OpenSC/archive/refs/tags/0.27.1.tar.gz
        sha256: 9b72f1b5d92569de67a42bf0edb21ecdc685ad03378343416362a99b90b1fad1
        x-checker-data:
          type: json
          is-important: true
          url: https://api.github.com/repos/OpenSC/OpenSC/releases/latest
          version-query: .tag_name
          url-query: '"https://github.com/OpenSC/OpenSC/archive/refs/tags/" + .tag_name
            + ".tar.gz"'
      # Patches by RIA from:  https://installer.id.ee/media/ubuntu/pool/main/o/opensc/opensc_0.27.1-0RIA3.debian.tar.xz
      - type: patch
        paths:
          - opensc/0001-Use-sysconfdir-opensc-for-opensc.conf.patch
          - opensc/0002-Drop-non-functional-ENABLE_AUTOSTART.patch
          - opensc/0004-esteid2018-fix.patch

  - name: c
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://github.com/open-eid/DigiDoc4-Client/releases/download/v4.11.1/qdigidoc4-4.11.1.tar.gz
        sha256: 16d7c37ef14cd15bab8d1bda3e7eb5e78ff29130f983490678aa6cc42d828977
        x-checker-data:
          type: json
          is-main-source: true
          url: https://api.github.com/repos/open-eid/DigiDoc4-Client/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name == "qdigidoc4-" + $version + ".tar.gz")
            | .browser_download_url
      - type: patch
        path: qdigidoc4/QPKCS11.patch
      - type: file
        path: ee.ria.qdigidoc4.metainfo.xml
      # See guide for building in a sandboxed environment:
      # https://github.com/open-eid/DigiDoc4-Client/wiki/DeveloperTips#building-in-sandboxed-environment
      - type: file
        url: https://ec.europa.eu/tools/lotl/eu-lotl.xml
        sha256: a36d0053df1afa96c88ede817a585b3168afeba84c1984a0e6cc5642453e70e6
        dest: client
        dest-filename: eu-lotl.xml
        x-checker-data:
          type: rotating-url
          url: https://ec.europa.eu/tools/lotl/eu-lotl.xml
      - type: file
        url: https://sr.riik.ee/tsl/estonian-tsl.xml
        sha256: c6b7b872fadcafdd24ad772f7b6649c5c87e3aa27ea44952727ea73d2c435918
        dest: client
        dest-filename: EE.xml
        x-checker-data:
          type: rotating-url
          url: https://sr.riik.ee/tsl/estonian-tsl.xml
      - type: file
        url: https://id.eesti.ee/config.json
        sha256: c4fff70c5ea3f3b43bdafed8a2220a6a4bc37c74f1056d5b50590227de8a38b9
        dest: common
        dest-filename: config.json
        x-checker-data:
          type: rotating-url
          url: https://id.eesti.ee/config.json
      - type: file
        url: https://id.eesti.ee/config.ecc
        sha256: 64ed77f949ab30af36c91622098454ceb21cf83f5a6aab35a5ea25d1e71ecfe8
        dest: common
        dest-filename: config.ecc
        x-checker-data:
          type: rotating-url
          url: https://id.eesti.ee/config.ecc
      - type: file
        url: https://id.eesti.ee/config.ecpub
        sha256: 26049d2d34acad69b33fb0dd6eba91a23df6f2b3c1228f5efc16e29a276a8c34
        dest: common
        dest-filename: config.ecpub
        x-checker-data:
          type: rotating-url
          url: https://id.eesti.ee/config.ecpub
      # qdigidoc4 saves files in $TMPDIR before opening them. Since this is inaccessible, we provide a wrapper script,
      # as advised here: https://docs.flatpak.org/en/latest/sandbox-permissions.html#filesystem-access
      - type: script
        dest-filename: run.sh
        commands:
          - env TMPDIR="$XDG_RUNTIME_DIR/app/$FLATPAK_ID" qdigidoc4 "$@"
    post-install:
      - install run.sh "${FLATPAK_DEST}/bin/run.sh"
      - install -Dm644 ee.ria.qdigidoc4.metainfo.xml $FLATPAK_DEST/share/metainfo/ee.ria.qdigidoc4.metainfo.xml
      - ln -s $FLATPAK_DEST/share/locale/et/LC_MESSAGES/nautilus-qdigidoc.mo $FLATPAK_DEST/share/locale/et/nautilus-qdigidoc.mo
      - desktop-file-edit --set-key=Exec --set-value="run.sh" /app/share/applications/ee.ria.qdigidoc4.desktop
